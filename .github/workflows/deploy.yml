name: Deploy Local Server

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Injecter le fichier .env
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env

      - name: Build & Restart Containers
        run: |
          docker compose down
          docker compose up -d --build