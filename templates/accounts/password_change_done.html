{% extends 'base.html' %}

{% block title %}Mot de passe modifié{% endblock %}

{% block content %}
<div class="auth-page-container">
    <div class="auth-card" style="text-align: center;">
        <div class="auth-icon-badge" style="background: var(--success-bg); border-color: var(--success-border); color: var(--success-text);">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        </div>
        <h1 class="auth-title">Mot de passe mis à jour</h1>
        <p class="auth-subtitle" style="margin-bottom: 2rem;">
            Votre mot de passe a été modifié avec succès. Vous pouvez continuer votre navigation en toute sécurité.
        </p>

        <a href="{% url 'accounts:dashboard' %}" class="btn btn-primary btn-block">
            Retour au tableau de bord
        </a>
    </div>
</div>
{% endblock %}
