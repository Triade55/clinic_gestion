{% extends 'base.html' %}

{% block title %}Mot de passe réinitialisé{% endblock %}

{% block content %}
<div class="auth-page-container">
    <div class="auth-card" style="text-align: center;">
        <div class="auth-icon-badge" style="background: var(--success-bg); border-color: var(--success-border); color: var(--success-text);">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        </div>
        <h1 class="auth-title">Réinitialisation réussie</h1>
        <p class="auth-subtitle" style="margin-bottom: 2rem;">
            Votre nouveau mot de passe a bien été enregistré. Vous pouvez dès à présent vous connecter.
        </p>

        <a href="{% url 'accounts:login' %}" class="btn btn-primary btn-block">
            Se connecter
        </a>
    </div>
</div>
{% endblock %}
