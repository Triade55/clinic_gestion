{% extends 'base.html' %}

{% block title %}Email envoyé{% endblock %}

{% block content %}
<div class="auth-page-container">
    <div class="auth-card" style="text-align: center;">
        <div class="auth-icon-badge" style="background: var(--info-bg); border-color: var(--info-border); color: var(--info-text);">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
        </div>
        <h1 class="auth-title">Vérifiez vos e-mails</h1>
        <p class="auth-subtitle" style="margin-bottom: 2rem;">
            Si un compte correspond à cette adresse, nous vous avons envoyé un lien pour réinitialiser votre mot de passe.
        </p>

        <a href="{% url 'accounts:login' %}" class="btn btn-secondary btn-block">
            Retour à l'écran de connexion
        </a>
    </div>
</div>
{% endblock %}
