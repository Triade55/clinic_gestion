services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clinic_web
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-clinic_db}
      - POSTGRES_USER=${POSTGRES_USER:-clinic_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-clinic_secret_pass}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-+l$3g+qpuzfy+dd!b-+)z5=0$c-!+in27p1*w^$+-^@dr2v@ol}
      - DEBUG=${DEBUG:-False}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      - AUTO_SEED=${AUTO_SEED:-1}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/accounts/login/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s

  db:
    image: postgres:16-alpine
    container_name: clinic_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clinic_db}
      POSTGRES_USER: ${POSTGRES_USER:-clinic_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinic_secret_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clinic_user} -d ${POSTGRES_DB:-clinic_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    name: clinic_postgres_data
  static_volume:
    name: clinic_static_data
  media_volume:
    name: clinic_media_data
